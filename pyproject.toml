[project]
name = "sumo-ml"
version = "0.1.0"
description = "Machine learning for predicting the outcomes of sumo matches"
authors = [
    {name = "Spencer Whitehead",email = "SpencerWhitehead7@gmail.com"}
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.13"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
altair = "^5.5.0"
jupyterlab = "^4.3.6"
polars = "^1.27.1"
requests = "^2.32.3"

[tool.poetry.group.dev.dependencies]
poethepoet = "^0.33.1"
ruff = "^0.11.2"

[tool.ruff.lint]
extend-select = ["I"] # add import sorting to ruleset

[tool.poe.tasks]
fmt.shell = "(ruff check --fix || true) && ruff format"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
